[pytest]
minversion = 8.0
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Put the BACKEND source tree on sys.path so `import domain`, `import
# application`, `import infrastructure`, `import interfaces` keep working
# without an editable install. The project root is deliberately NOT added:
# `frontend/interfaces` must never shadow `backend/interfaces`.
pythonpath = backend

addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    unit: isolated tests with no I/O or external dependencies
    integration: tests spanning two or more layers
    e2e: end-to-end tests exercising a complete workflow
    slow: tests that take a noticeable amount of time
