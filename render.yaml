services:
  - type: web
    name: federate-learning
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FEDSECUREAI_PRELOAD_MODELS
        value: "true"
    healthCheckPath: /health
